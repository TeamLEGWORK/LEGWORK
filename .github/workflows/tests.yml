# Runs the LEGWORK test suite across every supported Python version.

name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install LEGWORK and its test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Test the code with pytest
      run: |
        # test with as many cores as possible for speed
        pytest -n=auto --cov=legwork --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: false
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
