# Executes every demo notebook to check that the documented examples still run.
# Only needs the [test] extra: nbmake pulls in ipykernel itself, and the demos
# import nothing beyond legwork's own runtime dependencies.
# No Python matrix: this checks the notebooks, not interpreter compatibility.

name: Test demo notebooks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install LEGWORK
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Run the demo notebooks with nbmake
      run: pytest -n=auto --nbmake "docs/demos"
