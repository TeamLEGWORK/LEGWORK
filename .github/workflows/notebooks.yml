# Executes every demo notebook to check that the documented examples still run.
# Only needs the [test] extra: nbmake pulls in ipykernel itself, and the demos
# import nothing beyond legwork's own runtime dependencies.


name: Test demo notebooks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/demos/**'
      - 'pyproject.toml'
      - '.github/workflows/notebooks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/demos/**'
      - 'pyproject.toml'
      - '.github/workflows/notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Notebooks on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest supported versions — see note at the top of the file
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install LEGWORK
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Run the demo notebooks with nbmake
      run: pytest -n=auto --nbmake "docs/demos"
